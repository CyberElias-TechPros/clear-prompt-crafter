# JVM / Gradle
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=true
android.suppressUnsupportedCompileSdk=35

# Kotlin
kotlin.code.style=official

# ---------------------------------------------------------------------------
# App configuration
# ---------------------------------------------------------------------------
# Base URL of the Prompt-Gineer Cloudflare Worker API. This is baked into
# BuildConfig.API_BASE_URL at build time and can be overridden per install in
# Settings -> Advanced -> Server, so self-hosters do not need a custom build.
promptgineer.apiBaseUrl=https://prompt-gineer-api.autumn-surf-21ec.workers.dev

# Public support address shown in the app.
promptgineer.supportEmail=support@promptgineer.app

# ---------------------------------------------------------------------------
# Release signing (never commit real values; prefer environment variables)
# ---------------------------------------------------------------------------
# promptgineer.keystorePath=/absolute/path/to/release.jks
# promptgineer.keystorePassword=...
# promptgineer.keyAlias=promptgineer
# promptgineer.keyPassword=...
