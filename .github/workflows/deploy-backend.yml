name: Deploy backend

# Deploys worker/prompt-gineer-api on push to main. Schema lives in
# worker/schema.sql (db:init pattern, no migrations dir). Requires repo
# secrets CF_API_TOKEN + CF_ACCOUNT_ID (Admin account).

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN / CF_ACCOUNT_ID repo secrets (Admin account)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: worker
      - name: Deploy Worker
        run: npx wrangler deploy
        working-directory: worker
      - name: Verify health
        run: |
          body="$(curl -fsS https://prompt-gineer-api.autumn-surf-21ec.workers.dev/api/health)"
          echo "$body"
          echo "$body" | grep -q '"database":true' || { echo "::error::prompt-gineer-api health check failed"; exit 1; }
