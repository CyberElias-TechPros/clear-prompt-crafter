name: Set NVIDIA API key as secret

# Temporary helper: moves the platform NVIDIA NIM key out of wrangler.toml
# vars into a Worker secret (encrypted at rest). Dispatch-only; remove this
# file once the key is a secret and wrangler.toml no longer contains it.

on:
  workflow_dispatch:

jobs:
  set-secret:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: worker
      - name: Put NVIDIA_API_KEY secret (direct API)
        working-directory: worker
        run: |
          if [ -z "${{ secrets.NVIDIA_API_KEY }}" ]; then
            echo "::error::Missing NVIDIA_API_KEY repo secret"
            exit 1
          fi
          set -o pipefail
          curl -sS -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"NVIDIA_API_KEY\",\"type\":\"secret_text\",\"value\":\"${{ secrets.NVIDIA_API_KEY }}\"}" \
            -w "\nHTTP:%{http_code}\n" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/prompt-gineer-api/secrets/NVIDIA_API_KEY"
      - name: Verify secret is registered
        working-directory: worker
        run: |
          out="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/prompt-gineer-api/secrets")"
          echo "$out" | grep -q '"name":"NVIDIA_API_KEY"' || { echo "::error::secret not found on worker"; exit 1; }
      - name: Verify health
        run: |
          body="$(curl -fsS https://prompt-gineer-api.autumn-surf-21ec.workers.dev/api/health)"
          echo "$body" | grep -q '"database":true' || { echo "::error::health check failed"; exit 1; }