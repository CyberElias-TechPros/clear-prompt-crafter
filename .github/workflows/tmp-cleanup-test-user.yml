name: tmp-cleanup-test-user
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Delete verification test account
        run: |
          npx -y wrangler@latest d1 execute prompt-gineer-db --remote --command "DELETE FROM sessions WHERE user_id IN (SELECT id FROM users WHERE email='qafixcpc@example.com');"
          npx -y wrangler@latest d1 execute prompt-gineer-db --remote --command "DELETE FROM user_history WHERE user_id IN (SELECT id FROM users WHERE email='qafixcpc@example.com');"
          npx -y wrangler@latest d1 execute prompt-gineer-db --remote --command "DELETE FROM users WHERE email='qafixcpc@example.com';"
          npx -y wrangler@latest d1 execute prompt-gineer-db --remote --command "SELECT count(*) AS remaining FROM users WHERE email='qafixcpc@example.com';"
